*, *::before, *::after { box-sizing: border-box; min-width: 0; }
html, body { max-width: 100%; }
body { margin: 0; background: #0a0a0a; color: #f5f5f5; color-scheme: dark; }
.preview-context-shell {
  color: #1f2937;
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  color-scheme: light;
  font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
}
.preview-context {
  width: 100%;
  height: 47px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin: 0;
  padding: 0 calc(24px + env(safe-area-inset-right)) 0 calc(24px + env(safe-area-inset-left));
}
.preview-context-identity {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
}
.preview-context-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  height: 24px;
  min-width: 30px;
  padding: 0 6px;
  border: 1px solid #d1d5db;
  border-radius: 4px;
  color: #374151;
  background: #f3f4f6;
  font: 500 11px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
  font-variant-numeric: tabular-nums;
}
.preview-context-name {
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .02em;
}
.preview-context-actions {
  display: flex;
  align-items: center;
  flex: 0 0 auto;
  gap: 20px;
}
.preview-context-back,
.preview-context-use {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  text-decoration: none;
  overflow-wrap: normal;
  white-space: nowrap;
  border-radius: 5px;
}
.preview-context svg {
  width: 15px;
  height: 15px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.preview-context-back { color: #6b7280; }
.preview-context-back:hover { color: #111827; }
.preview-context-use { color: #f9fafb; }
.preview-context-use-label {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 32px;
  padding: 0 12px;
  border: 1px solid #111827;
  border-radius: 5px;
  background: #111827;
  color: #f9fafb;
  font-weight: 600;
  transition: background .15s ease, border-color .15s ease;
}
.preview-context-use:hover .preview-context-use-label { background: #374151; border-color: #374151; }
.preview-context a:focus-visible {
  outline: 2px solid #2563eb;
  outline-offset: 1px;
}

@media (max-width: 640px) {
  .preview-context { gap: 10px; padding: 0 calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left)); font-size: 12px; }
  .preview-context-identity { gap: 7px; }
  .preview-context-name { font-size: 12px; }
  .preview-context-actions { gap: 12px; }
  .preview-context-use-label { gap: 5px; padding: 0 9px; }
}

.demo-announcement { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
/* Shared interaction geometry; each demonstration supplies its own material palette. */
.pd-choice,.pd-stepper{--control-bg:#fff;--control-ink:#344650;--control-line:#d6dfe3;--control-accent:#23879a;--control-hover:#eff6f7;--control-radius:5px;--control-shadow:0 12px 32px #172c3a20;color:var(--control-ink);font:inherit}
.pd-choice{display:block;position:relative;width:100%;text-align:left}
.pd-choice>input[type=hidden]{display:none!important}
.demo-root .pd-choice-trigger,.stock-page .pd-choice-trigger{appearance:none;width:100%;min-height:44px;padding:10px 12px;margin:0;display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--control-bg);color:var(--control-ink);border:1px solid var(--control-line);border-radius:var(--control-radius);font:inherit;text-align:left;line-height:1.5;box-shadow:none;cursor:pointer}
.pd-choice-trigger>[data-choice-label]{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd-choice-trigger>svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;transition:transform .15s}
.pd-choice-trigger[aria-expanded=true]>svg{transform:rotate(180deg)}
.demo-root .pd-choice-trigger:hover,.demo-root .pd-choice-trigger[aria-expanded=true]{border-color:var(--control-accent);background:var(--control-hover)}
.demo-root .pd-choice-trigger:focus-visible{outline:2px solid var(--control-accent);outline-offset:3px}
.pd-choice-list{box-sizing:border-box;z-index:1000;display:block;overflow-y:auto;overscroll-behavior:contain;padding:5px;background:var(--control-bg);color:var(--control-ink);border:1px solid var(--control-line);border-radius:var(--control-radius);box-shadow:var(--control-shadow);font:inherit;line-height:1.5;scroll-padding:5px}
.pd-choice-list[hidden]{display:none!important}
.pd-choice-option{display:flex;align-items:center;gap:10px;min-height:42px;padding:10px 11px;border-radius:max(0px,calc(var(--control-radius) - 3px));cursor:pointer;font-size:12px;line-height:1.5;white-space:normal}
.pd-choice-option>span{flex:1}
.pd-choice-option>svg{width:16px;height:16px;flex:none;fill:none;stroke:var(--control-accent);stroke-width:1.7;opacity:0}
.pd-choice-option[aria-selected=true]{color:var(--control-accent);font-weight:600}
.pd-choice-option[aria-selected=true]>svg{opacity:1}
.pd-choice-option.pd-active,.pd-choice-option:hover{background:var(--control-hover)}
.pd-choice-option[aria-disabled=true]{opacity:.4;cursor:not-allowed}
.pd-swatch{width:24px;height:28px;flex:none;background:#f5f0df;border:1px solid #d6cfbd}
.pd-swatch-1{background:repeating-linear-gradient(90deg,#d9d4c9 0 1px,#f5f3e9 1px 3px)}
.pd-swatch-2{background-color:#e6ddc2;background-image:radial-gradient(#867d6099 .7px,transparent .7px);background-size:5px 6px}
.pd-stepper{display:flex!important;align-items:stretch;width:100%;border:1px solid var(--control-line);border-radius:var(--control-radius);background:var(--control-bg);overflow:hidden}
.pd-stepper:focus-within{outline:2px solid var(--control-accent);outline-offset:3px}
.pd-stepper input[type=number]{appearance:textfield;-moz-appearance:textfield;min-width:0;width:100%;height:auto;min-height:42px;padding:8px 3px!important;margin:0!important;text-align:center;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;color:var(--control-ink);font:inherit;outline:0!important}
.pd-stepper input::-webkit-inner-spin-button,.pd-stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.demo-root .pd-stepper>button,.stock-dialog .pd-stepper>button{width:38px;min-width:32px;min-height:42px;padding:0;margin:0;flex:0 0 38px;display:grid;place-items:center;border:0;border-radius:0;background:transparent;color:var(--control-accent);font:18px/1 ui-sans-serif,system-ui;box-shadow:none;cursor:pointer}
.demo-root .pd-stepper>button:hover,.stock-dialog .pd-stepper>button:hover{background:var(--control-hover)}
.pd-stepper>button:disabled{opacity:.3;cursor:not-allowed}
.pd-stepper>button[data-step="-1"]{order:-1}
.pd-stepper>button:focus-visible{outline:2px solid var(--control-accent);outline-offset:-4px}

  <script>(function init() {

  function draw() {

      <span class="s27-index">0${i + 1}</span>
      <div><p class="s27-tag">${D.escapeHtml(a.tag)} · ${a.minutes} 分钟</p>
      <h3>${D.escapeHtml(a.title)}</h3>
      <p class="s27-excerpt">${D.escapeHtml(a.excerpt)}</p>

  });

  draw();
})();</script></div></main>

        month = new Date(month.getFullYear(), month.getMonth() + count, 1, 12);
        const end = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
        focused = clamp(new Date(month.getFullYear(), month.getMonth(), Math.min(focused.getDate(), end), 12));
        month = new Date(focused.getFullYear(), focused.getMonth(), 1, 12); render(true); position();
      }
      trigger.addEventListener('click', open); input.addEventListener('click', open);
      input.addEventListener('keydown', event => { if (['ArrowDown','Enter',' '].includes(event.key)) {event.preventDefault(); open();} });
      input.addEventListener('input', validate); input.addEventListener('change', validate);
      previous.addEventListener('click', () => moveMonth(-1)); next.addEventListener('click', () => moveMonth(1));
      popup.querySelector('[data-calendar-today]').addEventListener('click', () => choose(iso(today())));
      popup.querySelector('[data-calendar-clear]').addEventListener('click', () => choose(''));
      grid.addEventListener('click', event => {const button = event.target.closest('[data-calendar-day]'); if (button && !button.disabled) choose(button.dataset.calendarDay);});
      // Some fields live inside a wrapping label; calendar clicks must not activate that label again.
      popup.addEventListener('click', event => event.preventDefault());
      popup.addEventListener('keydown', event => {
        if (event.key === 'Escape') {event.preventDefault();event.stopPropagation();close(true);return;}
        if (event.key === 'Tab') {
          const controls = [...popup.querySelectorAll('button:not(:disabled)')].filter(button => button.tabIndex >= 0);
          if (event.shiftKey && document.activeElement === controls[0]) {event.preventDefault(); controls.at(-1)?.focus();}
          else if (!event.shiftKey && document.activeElement === controls.at(-1)) {event.preventDefault();controls[0]?.focus();}
          return;
        }
        if (!event.target.matches('[data-calendar-day]')) return;
        let change = ({ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7})[event.key];
        if (event.key === 'Home') change = -((focused.getDay()+6)%7);
        if (event.key === 'End') change = 6-((focused.getDay()+6)%7);
        if (change !== undefined) {event.preventDefault();focused = clamp(addDays(focused,change));month = new Date(focused.getFullYear(),focused.getMonth(),1,12);render(true);position();}
        else if (event.key === 'PageUp' || event.key === 'PageDown') {event.preventDefault();moveMonth(event.key === 'PageUp' ? -1 : 1);}
      });
      document.addEventListener('pointerdown', event => { if (active && !wrapper.contains(event.target)) close(); });
      const dialog = input.closest('dialog');
      dialog?.addEventListener('close', () => close());
      dialog?.addEventListener('cancel', event => {if (active) {event.preventDefault(); close(true);}});
      input.form?.addEventListener('reset', () => setTimeout(validate,0));
      window.addEventListener('resize', () => {if (active) position();});
      document.addEventListener('scroll', event => {if (active && !popup.contains(event.target)) position();},true);
      validate();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind, {once:true}); else bind();
})();</script>
