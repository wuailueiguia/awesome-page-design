body { margin: 0; background: #0a0a12; color: #f1f5f9; color-scheme: dark; }
.preview-context-shell {

}
.preview-context {
  width: 100%;
  height: 47px;

  margin: 0;

  display: flex;

  gap: 10px;

}

  display: inline-flex;

  font-variant-numeric: tabular-nums;
}
.preview-context-name {
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .02em;
}
.preview-context-actions {
  display: flex;
  align-items: center;
  flex: 0 0 auto;
  gap: 20px;
}
.preview-context-back,
.preview-context-use {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  text-decoration: none;
  overflow-wrap: normal;
  white-space: nowrap;
  border-radius: 5px;
}
.preview-context svg {
  width: 15px;
  height: 15px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.preview-context-back { color: #6b7280; }
.preview-context-back:hover { color: #111827; }
.preview-context-use { color: #f9fafb; }
.preview-context-use-label {

.preview-context-use:hover .preview-context-use-label { background: #374151; border-color: #374151; }
.preview-context a:focus-visible {
  outline: 2px solid #2563eb;
  outline-offset: 1px;
}

/* Shared interaction geometry; each demonstration supplies its own material palette. */
.pd-choice,.pd-stepper{--control-bg:#fff;--control-ink:#344650;--control-line:#d6dfe3;--control-accent:#23879a;--control-hover:#eff6f7;--control-radius:5px;--control-shadow:0 12px 32px #172c3a20;color:var(--control-ink);font:inherit}

.pd-choice-list{box-sizing:border-box;z-index:1000;display:block;overflow-y:auto;overscroll-behavior:contain;padding:5px;background:var(--control-bg);color:var(--control-ink);border:1px solid var(--control-line);border-radius:var(--control-radius);box-shadow:var(--control-shadow);font:inherit;line-height:1.5;scroll-padding:5px}

.pd-stepper{display:flex!important;align-items:stretch;width:100%;border:1px solid var(--control-line);border-radius:var(--control-radius);background:var(--control-bg);overflow:hidden}
.pd-stepper:focus-within{outline:2px solid var(--control-accent);outline-offset:3px}
